<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      .bg { fill: #050816; }
      .trace { 
        fill: none; stroke: #FF00FF; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
        stroke-dasharray: 10 30;
        animation: flow 2s linear infinite;
      }
      .node { fill: #050816; stroke: #FF00FF; stroke-width: 3; }
      .hex-outer { 
        fill: #0B1020; stroke: #8A2BE2; stroke-width: 6; 
        filter: drop-shadow(0 0 8px rgba(138, 43, 226, 0.4));
      }
      .hex-inner { 
        fill: none; stroke: #00F5FF; stroke-width: 2; stroke-dasharray: 10 15; 
        transform-origin: 256px 256px;
        transform: scale(0.85);
        animation: pulse-inner 4s ease-in-out infinite;
      }
      .k-shape { 
        fill: none; stroke: #00F5FF; stroke-width: 24; stroke-linecap: square; stroke-linejoin: miter;
        filter: drop-shadow(0 0 12px rgba(0, 245, 255, 0.6));
      }
      .core-dot {
        fill: #FF00FF;
        transform-origin: 261px 256px;
        animation: pulse-dot 3s ease-in-out infinite;
      }
      @keyframes flow {
        from { stroke-dashoffset: 40; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulse-inner {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.8; filter: drop-shadow(0 0 5px #00F5FF); }
      }
      @keyframes pulse-dot {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(255,0,255,0.5)); }
        50% { transform: scale(1.2); filter: drop-shadow(0 0 16px rgba(255,0,255,1)); }
      }
    </style>
  </defs>

  <rect class="bg" width="512" height="512" rx="128" />

  <g id="circuit-traces">
    <path class="trace" d="M 256 106 L 256 65" />
    <path class="trace" d="M 256 406 L 256 447" />
    <path class="trace" d="M 386 181 L 416 151 L 457 151" />
    <path class="trace" d="M 386 331 L 416 361 L 457 361" />
    <path class="trace" d="M 126 331 L 96 361 L 55 361" />
    <path class="trace" d="M 126 181 L 96 151 L 55 151" />
  </g>

  <g id="circuit-nodes" class="node">
    <circle cx="256" cy="60" r="5" />
    <circle cx="256" cy="452" r="5" />
    <circle cx="462" cy="151" r="5" />
    <circle cx="462" cy="361" r="5" />
    <circle cx="50" cy="361" r="5" />
    <circle cx="50" cy="151" r="5" />
  </g>

  <g id="hex-core">
    <polygon class="hex-outer" points="256,106 386,181 386,331 256,406 126,331 126,181" />
    <polygon class="hex-inner" points="256,106 386,181 386,331 256,406 126,331 126,181" />
  </g>

  <g id="geometric-k" class="k-shape">
    <path d="M 191 166 L 191 346" />
    <path d="M 321 186 L 261 186 L 191 256 L 261 326 L 321 326" />
  </g>
  
  <circle id="core-dot" class="core-dot" cx="261" cy="256" r="10" />
</svg>
