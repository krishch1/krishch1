<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Background colors -->
    <radialGradient id="glowPurple" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#8A2BE2" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#050816" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCyan" cx="10%" cy="100%" r="50%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#050816" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0" />
      <stop offset="30%" stop-color="#00F5FF" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#8A2BE2" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0" />
    </linearGradient>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.5" />
    </pattern>

    <!-- Subtle Glow Filter for logo -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="#050816" />
  
  <!-- Subtle Grid -->
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Gradient Orbs -->
  <rect width="1200" height="400" fill="url(#glowPurple)" />
  <rect width="1200" height="400" fill="url(#glowCyan)" />

  <!-- Main Surface Card -->
  <rect x="40" y="40" width="1120" height="320" rx="12" fill="#0B1020" stroke="#1E293B" stroke-width="1" />

  <!-- Decorative Top Line on Card -->
  <rect x="41" y="41" width="1118" height="1" fill="url(#lineGrad)" />

  <!-- Tiny Geometric Corner Markers -->
  <!-- Top Left -->
  <path d="M 35 40 L 45 40 M 40 35 L 40 45" stroke="#94A3B8" stroke-width="1" opacity="0.7" />
  <!-- Top Right -->
  <path d="M 1155 40 L 1165 40 M 1160 35 L 1160 45" stroke="#94A3B8" stroke-width="1" opacity="0.7" />
  <!-- Bottom Left -->
  <path d="M 35 360 L 45 360 M 40 355 L 40 365" stroke="#94A3B8" stroke-width="1" opacity="0.7" />
  <!-- Bottom Right -->
  <path d="M 1155 360 L 1165 360 M 1160 355 L 1160 365" stroke="#94A3B8" stroke-width="1" opacity="0.7" />

  <!-- Logo Mark (KRON.OS) -->
  <g transform="translate(600, 115) scale(1.15)">
    <!-- Outer rings -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="#1E293B" stroke-width="1" />
    <circle cx="0" cy="0" r="24" fill="none" stroke="#F8FAFC" stroke-width="1.5" />
    
    <!-- Inner diamond (cyan) with subtle glow -->
    <rect x="-8" y="-8" width="16" height="16" rx="2" fill="none" stroke="#00F5FF" stroke-width="1.5" transform="rotate(45)" filter="url(#neonGlow)" />
    <rect x="-8" y="-8" width="16" height="16" rx="2" fill="none" stroke="#00F5FF" stroke-width="1.5" transform="rotate(45)" />
    
    <!-- Inner dot (purple) -->
    <circle cx="0" cy="0" r="2.5" fill="#8A2BE2" />
  </g>

  <!-- Typography -->
  <!-- KRON.OS (Large Header) -->
  <text x="600" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" letter-spacing="0.1em" fill="#F8FAFC" text-anchor="middle">KRON.OS</text>

  <!-- KRISH CHHATRI (Name) -->
  <text x="600" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" letter-spacing="0.25em" fill="#94A3B8" text-anchor="middle">KRISH CHHATRI</text>

  <!-- Role (Technical / Monospace) -->
  <text x="600" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'JetBrains Mono', monospace" font-size="14" font-weight="400" letter-spacing="0.05em" fill="#94A3B8" text-anchor="middle">Backend Engineer · AI Systems</text>

  <!-- Supporting Statement -->
  <text x="600" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#94A3B8" opacity="0.7" text-anchor="middle">Building scalable backend systems and intelligent infrastructure.</text>

</svg>
